        function getVipCooldownRemaining() { 
            if (!currentUser?.vipLastCollected) return 0; 
            if (!currentUser.vip && currentUser.vipType !== 'estagiario') return 0; 
            return Math.max(0, 86400000 - (Date.now() - new Date(currentUser.vipLastCollected).getTime())); 
        }

        function calculateGains(period) { 
            if (!currentUser) return 0; 
            const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate()); 
            let sd; 
            switch (period) { 
                case 'today': sd = today; break; 
                case 'yesterday': sd = new Date(today); sd.setDate(sd.getDate() - 1); break; 
                case 'month': sd = new Date(now.getFullYear(), now.getMonth(), 1); break; 
                case '2years': sd = new Date(now.getFullYear() - 2, now.getMonth(), now.getDate()); break; 
                default: return 0; 
            } 
            const ed = period === 'yesterday' ? today : now; 
            let tot = 0; 
            ['depositHistory','vipEarningsHistory','taskHistory','commissionHistory'].forEach(h => { 
                if (currentUser[h]) currentUser[h].forEach(it => { 
                    if (it.date) { 
                        const d = new Date(it.date); 
                        if (d >= sd && d <= ed) tot += (it.amount || 0); 
                    } 
                }); 
            }); 
            if (currentUser.fundHistory) currentUser.fundHistory.forEach(f => { 
                if (f.date) { 
                    const d = new Date(f.date); 
                    if (d >= sd && d <= ed) tot += ((f.returnValue || 0) - (f.amount || 0)); 
                } 
            }); 
            return tot; 
        }

        async function countDepositedReferralsForLevel() {
            if (!currentUser || !currentUser.phone) return 0;
            try {
                const user = await getUser(currentUser.phone);
                if (!user || !user.invitedUsers || user.invitedUsers.length === 0) return 0;
                const depositsSnap = await db.ref('depositos').once('value');
                const allDeposits = depositsSnap.exists() ? depositsSnap.val() : {};
                const usedReferrals = user.usedReferrals || [];
                const approvedPhones = [...new Set(Object.values(allDeposits).filter(d => d && d.status === 'approved').map(d => d.userPhone || d.phone).filter(Boolean))];
                let count = 0;
                for (const refPhone of user.invitedUsers) {
                    if (!usedReferrals.includes(refPhone) && approvedPhones.includes(refPhone)) count++;
                }
                return count;
            } catch (e) { return 0; }
        }

        async function getApprovedPhones() {
            try {
                const depositsSnap = await db.ref('depositos').once('value');
                const allDeposits = depositsSnap.exists() ? depositsSnap.val() : {};
                return [...new Set(Object.values(allDeposits).filter(d => d && d.status === 'approved').map(d => d.userPhone || d.phone).filter(Boolean))];
            } catch (e) { return []; }
        }

            if (!currentUser || !currentUser.phone) return;

            const depositedCount = await countDepositedReferralsForLevel();
            if (depositedCount >= currentReward.required) {
                currentUser.balance = (currentUser.balance || 0) + currentReward.reward;
                if (!currentUser.claimedReferralRewards) currentUser.claimedReferralRewards = [];
                currentUser.claimedReferralRewards.push(currentReward.level);

            const upd = async () => { 
                const st = await getServerTime(), n = new Date(st), end = new Date(n); 
                end.setHours(23, 59, 59, 999); 
                const diff = end - n; 
                if (diff <= 0) { el.textContent = '24:00:00'; setTimeout(upd, 1000); return; } 
                el.textContent = String(Math.floor(diff / 3600000)).padStart(2, '0') + ':' + String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0') + ':' + String(Math.floor((diff % 60000) / 1000)).padStart(2, '0'); 
                if (sel) sel.textContent = n.toLocaleTimeString('pt-MZ'); 
                setTimeout(upd, 1000); 
            }; 
            upd(); 
        }

                u.balance = (u.balance || 0) + (d.amount || 0); 
                if (!u.depositHistory) u.depositHistory = []; 
                u.depositHistory.push({ amount: d.amount, date: new Date().toISOString() }); 
                await setUser(phone, u); 
                if (currentUser && currentUser.phone === phone) { 
                    currentUser.balance = u.balance; 
                    updateBalanceDisplay(); 
                } 
                if (u.referredBy) { 
                    const ref = await getUser(u.referredBy); 
                    if (ref) { 
                        const isFraud = isSuspiciousNumber(u.referredBy, phone);
                        if (!isFraud) {
                            const comissionados = ref.commissionHistory ? [...new Set(ref.commissionHistory.map(c => c.fromPhone || ''))] : [];
                            if (comissionados.length < 3 || comissionados.includes(phone)) {
                                const com = Math.round((d.amount || 0) * 0.07); 
                                if (com > 0) { 
                                    ref.balance = (ref.balance || 0) + com; 
                                    ref.commission = (ref.commission || 0) + com; 
                                    if (!ref.commissionHistory) ref.commissionHistory = []; 
                                    ref.commissionHistory.push({ 
                                        amount: com, 
                                        date: new Date().toISOString(), 
                                        fromName: u.name, 
                                        fromPhone: phone,
                                        depositAmount: d.amount 
                                    }); 
                                    await setUser(u.referredBy, ref); 
                                }
                            }
                        }
                    } 
                } 
            } 
            alert('✅ Aprovado!'); 
            adminDepositsList(); 
        }

        async function adminRejectDeposit(key) { 
            if (!confirm('❌ RECUSAR?')) return; 
            await db.ref('depositos/' + key).update({ status: 'rejected' }); 
            alert('❌ Recusado!'); 
            adminDepositsList(); 
        }

        async function adminWithdrawalsList() { 
            const snap = await db.ref('saques').once('value'); 
            const saques = snap.exists() ? snap.val() : {}; 
            const pend = Object.entries(saques).filter(([k, s]) => s && s.status === 'pending'); 
            let html = '<div class="admin-section"><h4>💸 Saques Pendentes (' + pend.length + ')</h4>'; 
            if (pend.length === 0) html += '<div style="color:white;text-align:center;">✅ Nenhum</div>'; 
            else { 
                html += '<table class="admin-table"><thead><tr><th>Nome</th><th>Número</th><th>Enviar</th><th>Ações</th></tr></thead><tbody>'; 
                pend.forEach(([k, s]) => { html += '<tr><td>' + (s.name || 'N/A') + '</td><td>' + (s.phone || 'N/A') + '</td><td style="color:#00ff88;">' + (s.netAmount || 0).toLocaleString() + ' MT</td><td><button onclick="adminApproveWithdrawal(\'' + k + '\')" class="admin-btn admin-btn-success">✅</button> <button onclick="adminRejectWithdrawal(\'' + k + '\')" class="admin-btn admin-btn-danger">❌</button></td></tr>'; }); 
                html += '</tbody></table>'; 
            } 
            html += '</div>'; 
            document.getElementById('adminContent').innerHTML = html; 
        }

        async function adminApproveWithdrawal(key) { 
            const r = db.ref('saques/' + key); 
            const s = await r.once('value'); 
            if (!s.exists()) return; 
            const d = s.val(); 
            if (!confirm('✅ APROVAR SAQUE?\n💵 ' + (d.netAmount || 0).toLocaleString() + ' MT')) return; 
            await r.update({ status: 'approved', approvedAt: new Date().toISOString() }); 
            alert('✅ Aprovado!'); 
            adminWithdrawalsList(); 
        }

        async function adminRejectWithdrawal(key) { 
            const r = db.ref('saques/' + key); 
            const s = await r.once('value'); 
            if (!s.exists()) return; 
            const d = s.val(); 
            if (!confirm('❌ RECUSAR?\n💰 Devolver ' + (d.amount || 0).toLocaleString() + ' MT?')) return; 
            const u = await getUser(d.phone); 
            if (u) { u.balance = (u.balance || 0) + (d.amount || 0); await setUser(d.phone, u); } 
            await r.update({ status: 'rejected' }); 
            alert('❌ Recusado!'); 
            adminWithdrawalsList(); 
        }

        // ==================== INSTALL PWA ====================
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('installButton')?.classList.remove('hidden'); });
        async function installApp() { if (deferredPrompt) { deferredPrompt.prompt(); const { outcome } = await deferredPrompt.userChoice; if (outcome === 'accepted') { document.getElementById('installButton')?.classList.add('hidden'); alert('✅ App instalado!'); } deferredPrompt = null; } else { alert('📲 Use o menu do navegador → "Adicionar à tela inicial"'); } }
        window.addEventListener('appinstalled', () => { document.getElementById('installButton')?.classList.add('hidden'); });
        if (window.matchMedia('(display-mode: standalone)').matches) { document.getElementById('installButton')?.classList.add('hidden'); }

        // ==================== INICIALIZAÇÃO ====================
        async function init() {
            for (let i = 0; i < 20; i++) { 
                const p = document.createElement('div'); 
                p.className = 'particle'; 
                p.style.width = p.style.height = (Math.random() * 4 + 1) + 'px'; 
                p.style.left = Math.random() * 100 + '%'; 
                p.style.animationDelay = Math.random() * 15 + 's'; 
                p.style.animationDuration = (Math.random() * 8 + 8) + 's'; 
                document.getElementById('particles').appendChild(p); 
            }
            await getConfig(); 
            const a = await db.ref('admin/senha').once('value'); 
            if (a.exists()) adminPassword = a.val();
            await db.ref('admin').set({ senha: adminPassword }); 
            await db.ref('admin/withdrawSettings').once('value').then(s => { if (s.exists()) withdrawSettings = s.val(); });
            await setConfig(configCache); 
            setTimeout(checkReferralFromUrl, 300);
        }

        document.addEventListener('contextmenu', e => e.preventDefault());
        init();
    </script>
</body>
</html>
